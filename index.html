// ================================================================

function enemyTick() {
  if (G.screen!=='playing'||G.paused||!G.dungeon) return;
  const p=G.player, T=CFG.T;

  // Cola de spawning (tumbas de cripta: turno de transición ∴ → enemigo)
  for (let i=G.spawning.length-1;i>=0;i--) {
    const s=G.spawning[i];
    s.turns--;
    if (s.turns<=0) {
      const opts=CFG.ENEMY_DEFS.filter(e=>e.id==='ske'||e.id==='gho');
      const def=opts[ri(opts.length)], b=Math.floor(G.depth/2);
      G.enemies.push({...def,x:s.x,y:s.y,hp:def.hp+b,maxHp:def.maxHp+b,atk:def.atk+Math.floor(G.depth/3),alert:true});
      addMsg('¡El muerto se levanta!','#9060b0');
      sfx('trap');
      G.spawning.splice(i,1);
    }
  }
  for (const e of G.enemies) {
    if (G.screen!=='playing') break;   // el jugador ha muerto: se acaba el turno
    const dist=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
    // Invisibilidad: los enemigos no detectan al jugador
    const detectDist = p.invisible > 0 ? 0 : e.detect;
    if (dist<=detectDist) {
      e.alert=true;

      // ── Comportamientos diferenciados por tipo ──

      // Rata: huye si tiene menos del 30% HP
      if (e.id==='rat' && e.hp/e.maxHp < 0.30) {
        const fdx=-Math.sign(p.x-e.x), fdy=-Math.sign(p.y-e.y);
        const fDirs=[[fdx,0],[0,fdy],[fdx,fdy]];
        for (const[mdx,mdy]of fDirs){
          const nx=e.x+mdx,ny=e.y+mdy;
          if(!inBounds(nx,ny))continue;
          const t=G.dungeon.grid[ny][nx];
          if(t===T.WALL||t===T.DOOR_R||t===T.DOOR_B||t===T.DOOR_G||t===T.DOOR_GOLD||t===T.DOOR_GATE)continue;
          if(G.enemies.some(o=>o!==e&&o.x===nx&&o.y===ny))continue;
          if(nx===p.x&&ny===p.y)continue;
          e.x=nx;e.y=ny;break;
        }
        continue;
      }

      // Esqueleto: centinela — no deambula, solo persigue al detectar
      // (alert ya está en true, persigue normalmente — sin deambular, ver abajo)

      // Bruja: kiting — si está adyacente se aleja en lugar de atacar
      if ((e.id==='wit'||e.premium) && dist===1) {
        const fdx=-Math.sign(p.x-e.x), fdy=-Math.sign(p.y-e.y);
        for (const[mdx,mdy]of[[fdx,0],[0,fdy],[-fdx,0],[0,-fdy]]){
          const nx=e.x+mdx,ny=e.y+mdy;
          if(!inBounds(nx,ny))continue;
          const t=G.dungeon.grid[ny][nx];
          if(t===T.WALL||t===T.DOOR_R||t===T.DOOR_B||t===T.DOOR_G||t===T.DOOR_GOLD||t===T.DOOR_GATE||t===T.TRAP)continue;
          if(G.enemies.some(o=>o!==e&&o.x===nx&&o.y===ny))continue;
          if(nx===p.x&&ny===p.y)continue;
          e.x=nx;e.y=ny;break;
        }
        continue;
      }

      // Murciélago: movimiento errático — 40% ignora la dirección óptima
      let dirs;
      if (e.id==='bat' && Math.random()<0.40) {
        dirs=[[1,0],[-1,0],[0,1],[0,-1]];
        shuffle(dirs);
      } else {
        dirs=Math.abs(p.x-e.x)>=Math.abs(p.y-e.y)
          ?[[Math.sign(p.x-e.x),0],[0,Math.sign(p.y-e.y)],[0,-Math.sign(p.y-e.y)],[-Math.sign(p.x-e.x),0]]
          :[[0,Math.sign(p.y-e.y)],[Math.sign(p.x-e.x),0],[-Math.sign(p.x-e.x),0],[0,-Math.sign(p.y-e.y)]];
        // Fantasma: añade movimientos diagonales para poder rodear obstáculos
        if (e.id==='gho') dirs.push([Math.sign(p.x-e.x),Math.sign(p.y-e.y)],[-Math.sign(p.x-e.x),Math.sign(p.y-e.y)]);
      }
      for (const[mdx,mdy]of dirs){
        const nx=e.x+mdx,ny=e.y+mdy;
        if (!inBounds(nx,ny)) continue;
        const t=G.dungeon.grid[ny][nx];
        if (t===T.WALL||t===T.DOOR_R||t===T.DOOR_B||t===T.DOOR_G) continue;
        // Trampas bloquean a enemigos débiles (tier 1)
        if (t===T.TRAP && e.tier===1) continue;
        // Cofres y urnas bloquean a todos los enemigos
        if (G.items.some(it=>(it.type==='chest'||it.type==='urn')&&it.x===nx&&it.y===ny)) continue;
        if (G.enemies.some(o=>o!==e&&o.x===nx&&o.y===ny)) continue;
        if (nx===p.x&&ny===p.y){
          // Fantasmas bloqueados por inmunidad
          if (e.id==='gho' && p.ghostImmune>0) { addMsg('¡Inmune!','#60c0f0'); break; }
          // Espectro premium: ignora DEF del jugador
          const ignDef = e.premium && e.id==='gho';
          const d=Math.max(0,e.atk-(ignDef?0:p.def));
          if (d>0) {
            takeDamage(d,e.name);
            // Vampiro premium: se cura al golpear
            if (e.premium && e.id==='bat') { e.hp=Math.min(e.maxHp,e.hp+1); }
          } else addMsg(`${e.name} falla`,'#506050');
          break;
        }
        e.x=nx; e.y=ny; break;
      }
    } else {
      e.alert=false;
      // Esqueleto centinela: no deambula, permanece quieto
      if (e.id==='ske') continue;
      if (Math.random()<.4){
        const[mdx,mdy]=[[1,0],[-1,0],[0,1],[0,-1]][ri(4)];
        const nx=e.x+mdx,ny=e.y+mdy;
        if(inBounds(nx,ny)&&G.dungeon.grid[ny][nx]===T.FLOOR&&!G.enemies.some(o=>o!==e&&o.x===nx&&o.y===ny)&&!(nx===p.x&&ny===p.y)){e.x=nx;e.y=ny;}
      }
    }
  }
  render(); updateHUD();
  familiarTick();
  render();
  saveGameState();
}

function gainXP(amount) {
  G.xp+=amount;
  const needed = G.xpNext * (G.playerLevel + G.pendingLevelUps);
  if (G.xp >= needed) {
    G.pendingLevelUps++;
    sfx('levelup');
    addMsg(`¡Nivel ${G.playerLevel + G.pendingLevelUps}! (elige al salir)`,'#f0d040');
  }
}

function loadDungeon(depth) {
  G.screen = 'playing'; // asegurar estado correcto al cargar mazmorra
  const isShop = depth > 1 && depth % 5 === 0;
  G.dungeon = isShop ? generateShopDungeon(depth) : generateDungeon(depth);
  G.player.x=G.dungeon.startX; G.player.y=G.dungeon.startY;
  endBerserk(true); G.player.altarBuff=false;
  initFog();
  // Familiar persiste entre mazmorras; descansa en tienda
  if (G.familiar) {
    const fsp=findFamiliarSpawn();
    G.familiar.x=fsp.x; G.familiar.y=fsp.y;
    if (isShop) { G.familiar.hp=Math.min(G.familiar.maxHp,G.familiar.hp+1); addMsg('El familiar descansa (+1 VP)','#50e080'); }
  }
  // Mago: el espíritu Ɵ revive automáticamente al entrar en cada nivel
  if (G.player.cls==='m' && !G.familiar) {
    const famHp = 3 + Math.floor(G.depth/2);
    const fsp = findFamiliarSpawn();
    G.familiar = {x:fsp.x, y:fsp.y, hp:famHp, maxHp:famHp, atk:2, sym:'Ɵ', col:'#5090e0'};
    G.familiarRespawnCooldown = 0;
    addMsg('El espíritu se manifiesta','#5090e0');
  }
  if (isShop) {
    G.enemies = [];
    G.items   = [];
    placeShopItems(depth);
  } else {
    placeEntities(depth);
  }
  // Aplicar efecto de luz activo
  if (G.player.lightFog) {
    for (let y=0;y<CFG.GH;y++) for (let x=0;x<CFG.GW;x++) if(G.fog[y][x]===0) G.fog[y][x]=1;
  }
  // Aplicar secretos activos
  if (G.player.secretsMap>0) applySecretsMap();
  updateActionBar(); render(); updateHUD(); updateInventoryBar();
  addMsg(isShop ? '¡TIENDA! Compra lo que necesites' : `${G.dungeon.theme.name} · Piso ${depth}`, isShop ? '#40d0d0' : 'var(--dim)');
  computeLayout();
}

function nextDungeon() {
  const p = G.player;
  // Curar ligeramente entre niveles
  p.hp=Math.min(p.maxHp, p.hp+2);
  // Decrementar efectos de medallones (en niveles)
  if (p.ghostImmune>0) { p.ghostImmune--; if(!p.ghostImmune) addMsg('Inmunidad terminada','#60c0f0'); }
  if (p.secretsMap>0)  { p.secretsMap--;  if(!p.secretsMap)  addMsg('Secretos terminados','#e080e0'); }
  p.lightFog = false;  // La luz solo dura el nivel activo
  // Mago: +1 maná al bajar de nivel (regeneración garantizada)
  if (p.cls==='m') { p.mana=Math.min(p.maxMana, p.mana+1); addMsg('+1 Maná (nivel)','#5070e8'); }
  loadDungeon(G.depth);
}

function respawnPlayer() {
  hideOverlay();

  G.player.hp = Math.max(1, Math.floor(G.player.maxHp / 2));
  // Regenerar la mazmorra al mismo piso — el jugador conserva inventario y oro
  loadDungeon(G.depth);

function buildChoicePool() {
  const p = G.player;
  const pool = [
    { icon:'⚔', label:'+1 Ataque',        apply:()=>p.atk++ },
    { icon:'♥', label:'+2 VP máximos',    apply:()=>{ p.maxHp=Math.min(CFG.MAX_HP+4,p.maxHp+2); p.hp=Math.min(p.maxHp,p.hp+2); }},
    { icon:'†', label:'+1 Antorcha',      apply:()=>p.torches++ },
    { icon:'⊕', label:'+1 Defensa',       apply:()=>p.def++ },
    { icon:'◉', label:'Curación completa',apply:()=>p.hp=p.maxHp },
    { icon:'◆', label:'+25 Oro',          apply:()=>{ p.gold+=25; G.totalGold+=25; }},
  ];
  if (p.cls==='a') pool.push({ icon:'↑', label:'+8 Flechas',   apply:()=>p.arrows=Math.min(20,p.arrows+8) });
  if (p.cls==='m') pool.push({ icon:'✦', label:'+3 Maná máx.', apply:()=>{ p.maxMana+=3; p.mana=Math.min(p.maxMana,p.mana+3); }});
  if (p.cls==='w') pool.push({ icon:'⚔', label:'+2 Defensa',   apply:()=>p.def+=2 });
  return pool;
}

function showPendingLevelUps(onDone) {
  if (G.pendingLevelUps <= 0) {
    G.screen = 'playing'; // restaurar antes de cargar siguiente mazmorra
    onDone();
    return;
  }
  G.screen = 'levelup';  // detiene enemyTick mientras el jugador elige
  G.pendingLevelUps--;
  G.playerLevel++;

  const pool = buildChoicePool();
  shuffle(pool);
  const choices = pool.slice(0, 3);
  window._lvlChoices = choices;
  window._lvlDone = onDone;

  const cards = choices.map((c, i) => `
    <div class="lvl-card" onclick="applyLevelChoice(${i})">
      <div class="lvl-icon">${c.icon}</div>
      <div class="lvl-label">${c.label}</div>
    </div>`).join('');

  showOverlay(`
    <div class="screen-box">
      <div style="font-size:12px;letter-spacing:3px;color:var(--dim);margin-bottom:4px">NIVEL ${G.playerLevel}</div>
      <div style="font-size:24px;color:var(--gold);letter-spacing:6px;margin-bottom:20px">MEJORA</div>
      <div class="lvl-cards">${cards}</div>
      <div style="font-size:10px;color:var(--dim);margin-top:8px">Elige una mejora permanente</div>
    </div>
  `);
}

function applyLevelChoice(i) {
  const choice = window._lvlChoices[i];

  sfx('levelup');
  addMsg(`Nivel ${G.playerLevel}: ${choice.label}`,'#f0d040');

// Mapa de distancias BFS acotado desde (sx,sy), respetando muros/puertas.
// Devuelve Map: "x,y" -> {dist, dir:{dx,dy}} (dir = primer paso desde el origen)
function bfsFamiliarMap(sx, sy, maxDist) {
  const T = CFG.T;
  const blocked = (x,y) => {
    if (!inBounds(x,y)) return true;
    const t = G.dungeon.grid[y][x];
    return t===T.WALL||t===T.DOOR_R||t===T.DOOR_B||t===T.DOOR_G||t===T.DOOR_GOLD;
  };
  const map = new Map();
  map.set(sx+','+sy, {dist:0, dir:null});
  let frontier = [{x:sx,y:sy}];
  for (let d=1; d<=maxDist && frontier.length; d++) {
    const next=[];
    for (const node of frontier) {
      const info = map.get(node.x+','+node.y);
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx=node.x+dx, ny=node.y+dy, key=nx+','+ny;
        if (map.has(key) || blocked(nx,ny)) continue;
        map.set(key, {dist:d, dir: info.dir || {dx,dy}});
        next.push({x:nx,y:ny});
      }
    }
    frontier = next;
  }
  return map;
}

const FAMILIAR_RANGE = 7;       // antes 5: rango de detección de enemigos
const FAMILIAR_FOLLOW_DIST = 2; // antes 3: a partir de cuántas casillas empieza a seguir al jugador
const FAMILIAR_RESPAWN_TURNS = 8; // ~5-6s a 700ms/turno

function familiarTick() {
  if (!G.dungeon) return;

  // Resurrección del espíritu del mago si murió a mitad de piso (sin esperar al siguiente nivel)
  if (!G.familiar && G.player.cls==='m' && G.familiarRespawnCooldown > 0) {
    G.familiarRespawnCooldown--;
    if (G.familiarRespawnCooldown <= 0) {
      const famHp = 3 + Math.floor(G.depth/2);
      const fsp = findFamiliarSpawn();
      G.familiar = {x:fsp.x, y:fsp.y, hp:famHp, maxHp:famHp, atk:2, sym:'Ɵ', col:'#5090e0'};
      addMsg('El espíritu regresa','#5090e0');
    }
  }
  if (!G.familiar) return;

  const f = G.familiar;
  const NAV_RADIUS = 10; // radio de navegación (rango de detección + margen para seguir al jugador)
  const pathMap = bfsFamiliarMap(f.x, f.y, NAV_RADIUS);

  // Enemigo alcanzable más cercano en rango, por camino real (no línea recta)
  let target = null, targetInfo = null;
  for (const e of G.enemies) {
    const info = pathMap.get(e.x+','+e.y);
    if (!info || info.dist > FAMILIAR_RANGE) continue;
    if (!targetInfo || info.dist < targetInfo.dist) { target=e; targetInfo=info; }
  }

  if (target && targetInfo.dist === 1) {
    // Adyacente: atacar
    const dmg = f.atk;
    target.hp -= dmg;
    addMsg(`ω -${dmg} ${target.name}`,'#50e080');
    if (target.hp <= 0) {
      // Golpe letal: el enemigo no llega a replicar
      gainXP(Math.floor(target.xp/2));
      addMsg(`${target.name} (aliado) +${Math.floor(target.xp/2)}XP`,'#50e080');
      // Drop del enemigo
      if (Math.random()<0.1) G.items.push({type:'gold',x:target.x,y:target.y,amount:2+ri(4)});
      const ti = G.enemies.indexOf(target);
      if (ti!==-1) G.enemies.splice(ti,1);
      return;
    }
    // Réplica del enemigo al familiar (solo si sigue vivo)
    const edm = Math.max(0, target.atk - 1);
    if (edm > 0) {
      f.hp -= edm;
      if (f.hp <= 0) {
        addMsg('El familiar ha caído...','#50e080');
        sfx('death'); G.familiar = null;
        if (G.player.cls==='m') G.familiarRespawnCooldown = FAMILIAR_RESPAWN_TURNS;
        return;
      }
    }
    return;
  }

  if (target) {
    // Moverse el primer paso del camino real hacia el enemigo alcanzable más cercano
    // (dir es null si el objetivo está en la misma casilla: caso degenerado, no hacer nada)
    if (targetInfo.dir) {
      const nx=f.x+targetInfo.dir.dx, ny=f.y+targetInfo.dir.dy;
      if (!G.enemies.some(e=>e.x===nx&&e.y===ny) && !(nx===G.player.x&&ny===G.player.y)) {
        f.x=nx; f.y=ny;
      }
    }
    return;
  }

  // Sin enemigos alcanzables: seguir al jugador si está lejos
  const p=G.player;
  const dist=Math.abs(p.x-f.x)+Math.abs(p.y-f.y);
  if (dist>FAMILIAR_FOLLOW_DIST) {
    const info = pathMap.get(p.x+','+p.y);
    if (info && info.dir) {
      const nx=f.x+info.dir.dx, ny=f.y+info.dir.dy;
      if (!G.enemies.some(e=>e.x===nx&&e.y===ny) && !(nx===p.x&&ny===p.y)) { f.x=nx; f.y=ny; }
    } else {
      // Jugador fuera del radio de navegación: comportamiento simple de respaldo
      const dx=Math.sign(p.x-f.x), dy=Math.sign(p.y-f.y);
      for (const [mdx,mdy] of [[dx,0],[0,dy]]) {
        const nx=f.x+mdx, ny=f.y+mdy;
        if (!inBounds(nx,ny)) continue;
        if (G.dungeon.grid[ny][nx]===CFG.T.FLOOR && !G.enemies.some(e=>e.x===nx&&e.y===ny) && !(nx===p.x&&ny===p.y)) { f.x=nx; f.y=ny; break; }
      }
    }
  }
}

function saveRecords() {
  const r = loadRecords();
  if (G.depth   > (r.floor ||0)) r.floor  = G.depth;

  if (G.totalKills> (r.kills ||0)) r.kills  = G.totalKills;

const SAVE_KEY = 'dd_save';

function saveGameState() {
  if (!G.dungeon || G.screen!=='playing') return;
  const snapshot = {
    depth:G.depth, lives:G.lives,
    xp:G.xp, xpNext:G.xpNext, playerLevel:G.playerLevel, pendingLevelUps:G.pendingLevelUps,
    totalGold:G.totalGold, totalKills:G.totalKills,
    player:G.player, dungeon:G.dungeon, fog:G.fog,
    enemies:G.enemies, items:G.items, spawning:G.spawning,
    familiar:G.familiar, familiarRespawnCooldown:G.familiarRespawnCooldown,
    camX:G.camX, camY:G.camY,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot)); } catch {}
}

function hasSavedGame() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch { return false; }
}

function loadGameState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function clearSavedGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch {}
}

function resumeGame() {
  const saved = loadGameState();
  if (!saved) { showTitle(); return; }
  hideOverlay();
  G = Object.assign({ messages:[], projectile:null, lastDmgFlash:0, paused:false }, saved);
  G.screen = 'playing';
  inputLocked = false;
  updateActionBar(); updateInventoryBar(); updateHUD(); render();
  startLoop();
  addMsg('Partida continuada','#50e080');
}

let enemyInterval=null, rafId=null;

function startLoop() {
  if (enemyInterval) clearInterval(enemyInterval);
  enemyInterval=setInterval(enemyTick,CFG.ENEMY_MS);
  function loop(){ if(G.dungeon&&G.screen==='playing') render(); rafId=requestAnimationFrame(loop); }
  if (rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}

function setupInput() {
  // Teclado
  document.addEventListener('keydown', e => {
    const k=e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','s','a','d','W','S','A','D',' '].includes(k)) e.preventDefault();
    if      (k==='ArrowUp'   ||k==='w'||k==='W') tryMove(0,-1);
    else if (k==='ArrowDown' ||k==='s'||k==='S') tryMove(0,1);
    else if (k==='ArrowLeft' ||k==='a'||k==='A') tryMove(-1,0);
    else if (k==='ArrowRight'||k==='d'||k==='D') tryMove(1,0);
    else if (k===' ') shootProjectile();
    else if (k==='h'||k==='H') useConsumable('potion');
    else if (k==='f'||k==='F') useConsumable('food');
    else if (k==='m'||k==='M') useConsumable('mana_pot');
    else if (k>='1'&&k<='8') useSlot(parseInt(k)-1);
    else if (k==='Escape'&&G.dungeon) togglePause();
  });

  // Click en canvas
  canvas.addEventListener('click', e => {
    const r=canvas.getBoundingClientRect();
    moveToward(G.camX+(e.clientX-r.left)/TS, G.camY+(e.clientY-r.top)/TS);
  });

  // Touch: mantener = avanzar continuamente
  let tTarget=null, tInterval=null;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const r=canvas.getBoundingClientRect(), t=e.touches[0];
    tTarget={x:G.camX+(t.clientX-r.left)/TS, y:G.camY+(t.clientY-r.top)/TS};
    moveToward(tTarget.x,tTarget.y);
    tInterval=setInterval(()=>{ if(tTarget) moveToward(tTarget.x,tTarget.y); },180);
  },{passive:false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const r=canvas.getBoundingClientRect(), t=e.touches[0];
    tTarget={x:G.camX+(t.clientX-r.left)/TS, y:G.camY+(t.clientY-r.top)/TS};
  },{passive:false});
  canvas.addEventListener('touchend', e => {
    e.preventDefault(); clearInterval(tInterval); tTarget=null;
  },{passive:false});

  // Toolbar
  document.getElementById('btn-theme').addEventListener('click',  toggleTheme);
  document.getElementById('btn-audio').addEventListener('click',  toggleAudio);
  document.getElementById('btn-pause').addEventListener('click',  togglePause);
  document.getElementById('btn-restart').addEventListener('click',()=>showClassSelect());
  document.getElementById('btn-info').addEventListener('click',   showInfo);

  // ── D-pad táctil: hold-to-repeat ──
  function bindDir(id, dx, dy) {
    const btn=document.getElementById(id); if(!btn) return;
    let hold=null;
    const act=()=>tryMove(dx,dy);
    btn.addEventListener('touchstart',e=>{e.preventDefault();act();hold=setInterval(act,150);},{passive:false});
    btn.addEventListener('touchend',  e=>{e.preventDefault();clearInterval(hold);},{passive:false});
    btn.addEventListener('touchcancel',e=>{clearInterval(hold);},{passive:false});
    btn.addEventListener('mousedown',()=>{act();hold=setInterval(act,150);});
    btn.addEventListener('mouseup',()=>clearInterval(hold));
    btn.addEventListener('mouseleave',()=>clearInterval(hold));
  }
  bindDir('btn-up',    0,-1);
  bindDir('btn-down',  0, 1);
  bindDir('btn-left', -1, 0);
  bindDir('btn-right',  1, 0);

  // ── Disparo ──
  const bs=document.getElementById('btn-shoot');
  bs.addEventListener('click',shootProjectile);
  bs.addEventListener('touchstart',e=>{e.preventDefault();shootProjectile();},{passive:false});

  // ── Inversión de controles (zurdos) ──
  document.getElementById('btn-hand').addEventListener('click', toggleHandedness);
  document.getElementById('btn-dpad').addEventListener('click', toggleDpad);
}

function inBounds(x,y){ return x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH; }
function ri(n)        { return Math.floor(Math.random()*n); }
function shuffle(a)   { for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }
function brighten(hex,f){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,(r*f)|0)},${Math.min(255,(g*f)|0)},${Math.min(255,(b*f)|0)})`;
}

function toggleHandedness() {
  const row=document.getElementById('control-row');
  row.classList.toggle('invert');
  const inv=row.classList.contains('invert');
  document.getElementById('btn-hand').classList.toggle('active-btn', inv);
  document.getElementById('btn-hand').title = inv ? 'Invertir controles (diestros)' : 'Invertir controles (zurdos)';
  try { localStorage.setItem('dd_lefty', inv?'1':'0'); } catch{}
}

function initControls() {
  const row = document.getElementById('control-row');
  // Detección multicapa: pointer coarse (CSS ya lo cubre), JS como refuerzo
  const isTouch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
                || ('ontouchstart' in window)
                || (navigator.maxTouchPoints > 0)
                || /Android|iPhone|iPad|iPod|Tablet|Touch/i.test(navigator.userAgent);

  // Aplicar preferencia guardada (override manual)
  try {
    const saved = localStorage.getItem('dd_dpad');
    if (saved === 'on')  { row.classList.add('touch-on');  row.classList.remove('touch-off'); }
    if (saved === 'off') { row.classList.add('touch-off'); row.classList.remove('touch-on'); }
  } catch{}

  // Si es táctil y no hay override guardado, forzar visible
  if (isTouch) row.classList.add('touch-on');

  // Restaurar preferencia de mano
  try { if (localStorage.getItem('dd_lefty')==='1') toggleHandedness(); } catch{}

  // Actualizar icono del botón de dpad toggle
  updateDpadBtn();
}

function toggleDpad() {
  const row = document.getElementById('control-row');
  const visible = row.classList.contains('touch-on') || 
    (!row.classList.contains('touch-off') && getComputedStyle(row).display !== 'none');
  if (visible) {
    row.classList.remove('touch-on');
    row.classList.add('touch-off');
    try { localStorage.setItem('dd_dpad','off'); } catch{}
  } else {
    row.classList.remove('touch-off');
    row.classList.add('touch-on');
    try { localStorage.setItem('dd_dpad','on'); } catch{}
  }
  updateDpadBtn();
  computeLayout(); if (G.dungeon) render();
}

function updateDpadBtn() {
  const row = document.getElementById('control-row');
  const btn = document.getElementById('btn-dpad');
  if (!btn) return;
  const visible = !row.classList.contains('touch-off') &&
    (row.classList.contains('touch-on') || getComputedStyle(row).display !== 'none');
  btn.classList.toggle('active-btn', visible);
  btn.title = visible ? 'Ocultar cruceta' : 'Mostrar cruceta';
}

function init() {
  computeLayout();
  window.addEventListener('resize',()=>{ computeLayout(); if(G.dungeon) render(); });
  window.addEventListener('beforeunload', saveGameState);
  window.addEventListener('pagehide', saveGameState);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveGameState(); });
  setupInput();
  applyTheme('dark'); // tema inicial
  showTitle();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
</script>
